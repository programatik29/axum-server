[package]
edition = "2021"
name = "minimal-versions"
publish = false
version = "0.0.0"

[features]
tls-rustls = ["axum-server/tls-rustls", "dep:aws-lc-rs"]
tls-rustls-no-provider = ["axum-server/tls-rustls-no-provider"]
tls-rustls-ring = ["axum-server/tls-rustls-ring"]
tls-rustls-acme = ["tls-rustls", "axum-server/tls-rustls-acme"]
tls-openssl = ["axum-server/tls-openssl"]

[dependencies]
axum-server = { path = ".." }
# `tower` v0.5.0 incorrectly only requires `tower-layer` v0.3.0
tower-layer = "0.3.3"
# `aws-lc-sys` versions before 0.28 use `cmake_minimum_required(VERSION 3.0)`,
# which CMake 4 no longer accepts. `aws-lc-rs` 1.13 pulls in 0.28.
aws-lc-rs = { version = "1.13", optional = true }
# `num-bigint` 0.4.0 no longer compiles on current rustc: its `div_ceil(&u64)`
# call now resolves to the inherent `u64::div_ceil(u64)`.
num-bigint = "0.4.6"
