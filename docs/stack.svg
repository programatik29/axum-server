<svg xmlns="http://www.w3.org/2000/svg" width="900" height="570" viewBox="0 0 900 570" role="img" aria-labelledby="title desc">
  <title id="title">The axum-server stack</title>
  <desc id="desc">A request moves from the client through the transport tier (tokio, hyper, hyper-util), then axum-server, then the application tier (MakeService, tower layers, axum Router). The response follows a dashed path back to the client.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
    <marker id="arrow-dashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8c959f"/>
    </marker>
  </defs>

  <rect width="900" height="570" fill="#ffffff"/>

  <!-- client -->
  <rect x="370" y="24" width="160" height="44" rx="22" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="450" y="52" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#1f2328">client</text>

  <!-- request -->
  <line x1="450" y1="68" x2="450" y2="106" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="462" y="92" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#57606a">request</text>

  <!-- transport tier -->
  <rect x="140" y="110" width="620" height="112" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="160" y="132" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" letter-spacing="1.2" fill="#57606a">TRANSPORT</text>

  <rect x="160" y="146" width="180" height="58" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="250" y="169" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#1f2328">tokio</text>
  <text x="250" y="188" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#57606a">sockets · timers</text>

  <rect x="360" y="146" width="180" height="58" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="450" y="169" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#1f2328">hyper</text>
  <text x="450" y="188" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#57606a">HTTP codecs</text>

  <rect x="560" y="146" width="180" height="58" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="650" y="169" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#1f2328">hyper-util</text>
  <text x="650" y="188" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#57606a">protocol choice</text>

  <line x1="340" y1="175" x2="358" y2="175" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="540" y1="175" x2="558" y2="175" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- transport to server -->
  <line x1="450" y1="222" x2="450" y2="256" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="462" y="244" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#57606a">HTTP/1 or HTTP/2</text>

  <!-- axum-server -->
  <rect x="250" y="258" width="400" height="84" rx="10" fill="#dafbe1" stroke="#2da44e"/>
  <text x="450" y="290" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#1f2328">axum-server</text>
  <text x="450" y="312" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#57606a">accept loop · task per connection · TLS</text>

  <!-- server to application -->
  <line x1="450" y1="342" x2="450" y2="376" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="462" y="364" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#57606a">peer address</text>

  <!-- application tier -->
  <rect x="140" y="378" width="620" height="112" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="160" y="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" letter-spacing="1.2" fill="#57606a">APPLICATION</text>

  <rect x="160" y="414" width="180" height="58" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="250" y="437" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#1f2328">MakeService</text>
  <text x="250" y="456" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#57606a">one per connection</text>

  <rect x="360" y="414" width="180" height="58" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="450" y="437" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#1f2328">tower layers</text>
  <text x="450" y="456" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#57606a">middleware</text>

  <rect x="560" y="414" width="180" height="58" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="650" y="437" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#1f2328">axum Router</text>
  <text x="650" y="456" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#57606a">routing</text>

  <line x1="340" y1="443" x2="358" y2="443" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="540" y1="443" x2="558" y2="443" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- response -->
  <polyline points="760,443 815,443 815,46 534,46" fill="none" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-dashed)"/>
  <text transform="rotate(-90 831 250)" x="831" y="250" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#57606a">response</text>
</svg>
